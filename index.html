<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <!-- viewport-fit=cover lets the game draw behind the iPhone notch; SafeArea.cs keeps the UI out of it. -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hands Off</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <!-- Installable web app: "Add to Home Screen" opens the game full screen with this icon and name. -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#231F20">
    <!-- Same thing for iPhone and iPad, which read these tags instead of the manifest. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Hands Off">
    <link rel="apple-touch-icon" href="TemplateData/icons/icon-180.png">
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=1280 height=720 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      // Shows a temporary message banner for a few seconds, or a permanent error message if type == 'error'.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/git logo 4.5.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/git logo 4.5.data.unityweb",
        frameworkUrl: buildUrl + "/git logo 4.5.framework.js.unityweb",
        codeUrl: buildUrl + "/git logo 4.5.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Donaldgames67",
        productName: "Hands Off",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      // Fill the whole screen on phones and tablets, also when embedded in a frame (e.g. on itch.io).
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
        || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent)); // iPads pretending to be Macs
      var inFrame = window.self !== window.top;

      if (isMobile || inFrame) {
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        // Desktop: the game canvas in a window of the size set in Player Settings.
        canvas.style.width = "1280px";
        canvas.style.height = "720px";
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
